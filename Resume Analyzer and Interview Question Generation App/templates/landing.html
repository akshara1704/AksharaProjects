<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Welcome</title>
   <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        text-align: center;
      }
      button {
        padding: 10px;
        margin: 10px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
   </style>
</head>
<body>
   <div class="container">
      <h1>Choose Your Service</h1>
      <form action="/resume" method="GET">
        <button type="submit">Resume Analyzer</button>
      </form>
      <form action="/interview" method="GET">
        <button type="submit">Interview Question Generator</button>
      </form>
   </div>
</body>
</html>
