<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart File Insight Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h2 class="mb-4">📄 Smart File Insight & Report Generator</h2>
        <form action="/analyze" method="POST" enctype="multipart/form-data" class="p-4 border rounded bg-white shadow-sm">
            <input type="file" name="file" accept=".csv,.docx" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary w-100">Generate Report</button>
        </form>
    </div>
</body>
</html>
